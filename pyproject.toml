[project]
name = "videometa"
version = "0.0.21"
description = "Turn surveillance video into structured event annotations: a VLM window filter, YOLO tracking, and a VLM annotator."
readme = "README.md"
authors = [
    { name = "Juan Vargas Torres", email = "Juan.VargasTorres@student.uts.edu.au" },
    { name = "Nelkit Chavez Calona", email = "Nelkit.ChavezCalona@student.uts.edu.au" },
    { name = "Gourika Sood", email = "Gourika.Sood@student.uts.edu.au" },
    { name = "Maria Jose Bustamante Grajales", email = "Maria.J.BustamanteGrajales@student.uts.edu.au" },
    { name = "Saurabh Sabharwal", email = "Saurabh.Sabharwal@student.uts.edu.au" },
    { name = "Abhishek Chopda", email = "Abhishek.P.Chopda@student.uts.edu.au" },
]
requires-python = ">=3.14"
dependencies = []
license = { file = "LICENSE" }
keywords = [
    "video",
    "annotation",
    "metadata",
    "vision-language-model",
    "yolo",
    "object-tracking",
    "qwen",
    "surveillance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

[project.urls]
Homepage = "https://github.com/uts-ilab-p08/videometa"
Repository = "https://github.com/uts-ilab-p08/videometa"
Changelog = "https://github.com/uts-ilab-p08/videometa/blob/main/CHANGELOG.md"
Issues = "https://github.com/uts-ilab-p08/videometa/issues"

[project.optional-dependencies]
# Video decoding, the motion gate, and YOLO object extraction.
# Matches the `pip install videometa[vision]` hint raised by _import_cv2().
vision = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "ultralytics>=8.3",
]
# Hosted LVLM window annotation.
lvlm = ["openai>=1.40"]
# Local Qwen annotation via MLX (Apple silicon only).
local = ["mlx-vlm>=0.1"]

[dependency-groups]
# Deliberately excludes `ultralytics` (pulls ~520 MB of torch); install it with
#   uv pip install -e ".[vision]"
# when you need YOLO object extraction.
dev = [
    "pytest>=8.0",
    "numpy>=2.0",
    "opencv-python>=4.10",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
